# Tailscale MagicDNS 주소로 HTTPS를 종료하고 기존 frontend(3000)/backend(8000)로
# 프록시한다 — PWA가 standalone(주소창 없음) 모드로 설치되려면 HTTPS가 필수라
# 추가됐다(Chrome은 HTTP 사이트에서 standalone 설치를 허용하지 않음). 인증서는
# `tailscale cert`로 발급하며 90일마다 갱신 필요(deploy/nginx/renew-cert.sh 참고).
#
# /api/로 시작하는 요청만 backend로 보낸다 — backend의 실제 라우트가 이미
# /api/v1/...로 시작하므로 proxy_pass 뒤에 경로를 붙이지 않아야(리라이트 없이)
# 그대로 전달된다. 나머지는 frontend(Next.js)로 보낸다.
server {
    listen 443 ssl;
    server_name upbit-server.tailb1c1e9.ts.net;

    ssl_certificate     /etc/nginx/tailscale-certs/upbit-server.crt;
    ssl_certificate_key /etc/nginx/tailscale-certs/upbit-server.key;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
